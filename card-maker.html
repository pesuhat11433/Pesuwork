<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>首頁卡片產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Bebas+Neue&family=Poppins:wght@400;600;800&family=Playfair+Display:wght@700;900&family=Righteous&family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f2ef; --panel:#ffffff; --ink:#111111;
    --accent:#c6ff33; --line:#111111; --muted:#6b6b6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:360px;min-width:360px;background:var(--panel);border-right:2px solid var(--ink);overflow-y:auto;padding:20px;}
  .stage{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:28px;padding:20px;overflow:auto;background:var(--bg);}
  .stage-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  h1{font-family:'Anton',sans-serif;font-size:22px;margin:0 0 16px;letter-spacing:.3px;text-transform:uppercase;}
  h2{font-family:'Anton',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink);}
  h2:first-of-type{margin-top:0;}
  h3{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px;font-weight:700;}
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  .card-row-scroll{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin;}
  .card-row-scroll .chip{flex:0 0 auto;min-width:56px;white-space:nowrap;}
  .card-group{margin-bottom:8px;}
  .card-group-label{font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;}
  .card-group-label-input{font-size:10px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:.5px;border:none;border-bottom:1px dashed #bbb;background:transparent;padding:2px 0;width:100%;font-family:inherit;}
  .card-group-label-input:focus{outline:none;border-bottom-color:var(--ink);}
  .chip{flex:1;min-width:70px;padding:9px 6px;background:var(--ink);border:2px solid var(--ink);border-radius:999px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;}
  .chip:hover{background:#333;}
  .chip.active{background:var(--accent);border-color:var(--ink);color:var(--ink);}
  .layouts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .layout-thumb{aspect-ratio:4/3;border:2px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);position:relative;overflow:hidden;}
  .layout-thumb.active{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent) inset;}
  .layout-thumb svg{width:100%;height:100%;padding:4px;}
  label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 5px;}
  input[type=text], select, textarea{width:100%;padding:9px 12px;background:#fff;border:2px solid var(--ink);border-radius:14px;color:var(--ink);font-size:12px;font-family:'Poppins',sans-serif;}
  input[type=range]{width:100%;accent-color:var(--ink);}
  input[type=color]{width:100%;height:32px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:2px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px;}
  .toggle-row span{font-size:11px;font-weight:600;color:var(--ink);}
  .grp{border:2px solid var(--ink);border-radius:16px;padding:12px;margin-top:8px;background:#fff;}
  .subgrp{border:1.5px dashed var(--ink);border-radius:12px;padding:10px;margin-top:8px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .upload-btn{display:block;width:100%;padding:11px;background:#fff;border:2px dashed var(--ink);border-radius:999px;text-align:center;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;margin-top:6px;}
  .upload-btn:hover{background:var(--accent);border-style:solid;}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .thumb-wrap{position:relative;}
  .thumb-wrap img{width:44px;height:44px;object-fit:cover;border-radius:10px;border:2px solid var(--ink);cursor:pointer;display:block;}
  .thumb-wrap.sel-1 img{border-color:var(--accent);box-shadow:0 0 0 2px var(--ink);}
  .thumb-wrap.sel-2 img{border-color:#111;box-shadow:0 0 0 2px var(--accent);}
.thumb-wrap .idx-num{position:absolute;bottom:-6px;left:-6px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:8px;font-weight:900;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .thumb-wrap .del-btn{position:absolute;top:-6px;left:-6px;background:#e03131;color:#fff;border:2px solid #fff;font-size:9px;font-weight:900;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .thumb-wrap .before-btn{position:absolute;bottom:-6px;right:-6px;background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:9px;font-weight:900;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .thumb-wrap .before-btn.active{background:#f59e0b;color:#fff;border-color:#f59e0b;}
  .thumb-wrap .badge-num{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--accent);font-size:9px;font-weight:900;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  input[type=file]{display:none;}
  .canvas-wrap{background:repeating-conic-gradient(#e8e8e4 0% 25%, #f7f7f4 0% 50%) 50%/20px 20px;border-radius:16px;padding:16px;border:2px solid var(--ink);}
  .canvas-stage{position:relative;display:inline-block;line-height:0;}
  .center-guide{position:absolute;inset:0;pointer-events:none;}
  .center-guide .marks{display:none;}
  .center-guide.show-center .marks{display:block;}
  .center-guide i{position:absolute;background:rgba(198,255,51,.9);}
  .center-guide .v-mid{left:50%;top:0;bottom:0;width:1px;margin-left:-0.5px;}
  .center-guide .h-mid{top:50%;left:0;right:0;height:1px;margin-top:-0.5px;}
  .center-guide .v-third{top:0;bottom:0;width:1px;background:rgba(17,17,17,.35);}
  .center-guide .h-third{left:0;right:0;height:1px;background:rgba(17,17,17,.35);}
  .center-guide .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);border:1px solid var(--ink);left:50%;top:50%;margin:-3px 0 0 -3px;}
  .center-guide .grid{position:absolute;inset:0;display:none;background-image:
    repeating-linear-gradient(to right, rgba(17,17,17,.28) 0 1px, transparent 1px 10%),
    repeating-linear-gradient(to bottom, rgba(17,17,17,.28) 0 1px, transparent 1px 10%);}
  .center-guide.show-grid .grid{display:block;}
  .guide-toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink);}
  .guide-toggles{display:flex;gap:14px;flex-wrap:wrap;}
  canvas{display:block;max-width:56vw;max-height:64vh;border-radius:6px;}
  .dl{padding:13px 30px;background:var(--ink);border:2px solid var(--ink);border-radius:999px;color:#fff;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;}
  .dl:hover{background:var(--accent);color:var(--ink);}
  .size-label{font-size:12px;font-weight:700;color:var(--ink);}
  .fontname-tag{display:inline-block;font-size:10px;font-weight:700;background:var(--accent);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;margin:4px 4px 0 0;color:var(--ink);}
  .svg-preview{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .svg-preview img{width:32px;height:32px;background:#fff;border-radius:8px;padding:2px;border:2px solid var(--ink);}
  .comp-tabs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .comp-tab{flex:1;min-width:60px;padding:8px 4px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;color:var(--ink);}
  .comp-tab.active{background:var(--ink);color:var(--accent);}
  .comp-tab.comp-tab-disabled{opacity:.35;cursor:not-allowed;background:#eee;color:#999;border-color:#ccc;}
  .hint{font-size:10px;color:var(--muted);line-height:1.5;margin-top:4px;}
  .preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .preset-chip{display:flex;align-items:center;gap:4px;padding:6px 10px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;}
  .preset-chip:hover{background:var(--accent);}
  .preset-chip .x{color:#999;font-weight:900;margin-left:2px;}
  .preset-chip .x:hover{color:#e03131;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#111;border-radius:4px;}
  /* ---------- mobile layout ---------- */
  @media (max-width: 860px){
    body{flex-direction:column;height:auto;min-height:100vh;overflow:auto;}
    .sidebar{width:100%;min-width:0;max-height:none;border-right:none;border-bottom:2px solid var(--ink);order:2;}
    .stage{flex-direction:column;order:1;padding:14px;gap:18px;}
    .stage-col{width:100%;}
    .canvas-wrap{padding:10px;}
    canvas{max-width:88vw;max-height:48vh;}
    .layouts{grid-template-columns:repeat(3,1fr);}
    .two-col{grid-template-columns:1fr 1fr;}
    input[type=range]{height:26px;}
    .chip,.comp-tab,.upload-btn,.dl{padding:12px 10px;font-size:12px;}
    h1{font-size:18px;}
    .mobile-hint{display:block;}
  }
  .mobile-hint{display:none;font-size:10px;color:var(--muted);margin:-4px 0 10px;}
  .mobile-tabbar{display:none;}
  @media (max-width: 860px){
    .mobile-tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;position:sticky;top:0;background:var(--panel);z-index:20;padding:4px 0 10px;margin-bottom:10px;border-bottom:2px solid var(--ink);}
    .mobile-tabbar .mtab{flex:0 0 auto;padding:10px 16px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;cursor:pointer;}
    .mobile-tabbar .mtab.active{background:var(--ink);color:var(--accent);}
    .mobile-panel{display:none;}
    .mobile-panel.mobile-panel-active{display:block;animation:mpfade .15s ease;}
  }
  @keyframes mpfade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="sidebar">
  <h1>🎴 首頁卡片產生器</h1>
  <div class="mobile-hint">📱 手機版：預覽畫布在上方，下方點選分頁切換編輯項目</div>
  <div class="hint" id="autosaveStatus" style="margin-bottom:4px;">💾 已自動儲存在這台電腦的瀏覽器裡</div>
  <button class="upload-btn" id="clearAutosaveBtn" style="margin-bottom:10px;font-size:10px;padding:6px;">🗑 清除本機紀錄，重新開始</button>

  <div class="mobile-tabbar" id="mobileTabbar">
    <div class="mtab active" data-mtab="cards">卡片</div>
    <div class="mtab" data-mtab="sizelayout">尺寸／版面</div>
    <div class="mtab" data-mtab="image">圖片</div>
    <div class="mtab" data-mtab="text">文字／樣式</div>
  </div>

  <div class="mobile-panel mobile-panel-active" data-mtab="cards">
  <h2>卡片配置（最多 10 組）</h2>
  <div id="cardRow"></div>
  <button class="upload-btn" id="dupCardBtn" style="border-style:solid;">➕ 複製目前卡片，新增下一張</button>
  </div>

  <div class="mobile-panel" data-mtab="sizelayout">
  <h2>尺寸</h2>
  <div class="row" id="sizeRow"></div>

  <h2>版面（Figma 四款）</h2>
  <div class="layouts" id="layoutRow"></div>
  </div>

  <div class="mobile-panel" data-mtab="image">
  <h2>模特圖</h2>
  <label>點縮圖選取：單圖模式選 1 張；拼接模式依序點 2 張（第一次點 = 上/左，第二次點 = 下/右）。左下角灰色數字是圖片編號。右下角「B」按鈕可把該圖指定為 BA 對比小圖（Before）。</label>
  <label class="upload-btn" for="fileInput">＋ 選擇圖片</label>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <div class="thumbs" id="thumbs"></div>

  <label>底圖版式</label>
  <select id="imgMode">
    <option value="single">單圖滿版</option>
    <option value="vertical">上下拼接</option>
    <option value="horizontal">左右拼接</option>
    <option value="ba">大圖＋小圖對比（BA / Before-After）</option>
  </select>
  <div id="ratioWrap" style="display:none;">
    <label>拼接比例</label>
    <div style="display:flex;gap:4px;align-items:center;">
      <input type="range" id="imgRatio" min="10" max="90" value="50" style="flex:1;">
      <input type="number" id="imgRatio_num" min="10" max="90" value="50" style="width:52px;padding:5px 4px;border:2px solid var(--ink);border-radius:8px;font-size:11px;font-family:inherit;text-align:center;">
    </div>
  </div>

  <div class="grp" id="imgPosPanel"></div>
  <div class="grp" id="beforeImgPanel" style="display:none;"></div>
  </div>

  <div class="mobile-panel" data-mtab="text">
  <label class="upload-btn" for="fontInput">＋ 上傳自訂字體 (.ttf / .otf / .woff)，會加入下方各元件的字型選單</label>
  <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2">
  <div id="customFontTags"></div>

  <h2>元件樣式（字型／位移／色塊／圖示皆各自獨立）</h2>
  <div class="comp-tabs" id="compTabs"></div>
  <div class="grp" id="compPanel"></div>
  </div>
</div>

<div class="stage">
  <div class="stage-col">
    <div class="size-label" id="sizeLabel">1280 × 720 px（滿版輸出，無外框）</div>
    <div class="guide-toggles">
      <label class="guide-toggle"><input type="checkbox" id="guideToggle"> 顯示置中參考線</label>
      <label class="guide-toggle"><input type="checkbox" id="gridToggle"> 顯示網格參考</label>
    </div>
    <div class="canvas-wrap">
      <div class="canvas-stage">
        <canvas id="cv"></canvas>
        <div class="center-guide" id="centerGuide">
          <div class="grid"></div>
          <div class="marks">
            <i class="v-third" style="left:33.333%;"></i>
            <i class="v-third" style="left:66.666%;"></i>
            <i class="h-third" style="top:33.333%;"></i>
            <i class="h-third" style="top:66.666%;"></i>
            <i class="v-mid"></i>
            <i class="h-mid"></i>
            <i class="dot"></i>
          </div>
        </div>
      </div>
    </div>
    <button class="dl" id="downloadBtn">下載 PNG</button>
  </div>
</div>

<script>
const SIZES = [
  {w:1280,h:720,label:'1280×720'},
  {w:360,h:360,label:'360×360'},
  {w:360,h:480,label:'360×480'},
  {w:720,h:960,label:'720×960'},
];
const LAYOUT_NAMES = ['標籤款＋圖示（card1）','置中標題款（card2）','標籤款（card3）','置中標題＋副標款（card4）'];

const FONT_OPTIONS = [
  {value:"'Noto Sans TC',sans-serif", label:'Noto Sans TC'},
  {value:"'Bebas Neue',sans-serif", label:'Bebas Neue'},
  {value:"'Poppins',sans-serif", label:'Poppins'},
  {value:"'Playfair Display',serif", label:'Playfair Display'},
  {value:"'Righteous',cursive", label:'Righteous'},
  {value:"'Anton',sans-serif", label:'Anton'},
];

function newTextStyle(size,weight,text){
  return {
    text: text||'', font:FONT_OPTIONS[0].value, size, color:'#ffffff', weight, offsetX:0, offsetY:0,
    letterSpacing:0, lineHeight:1.4,
    outlineOn:false, outlineColor:'#000000', outlineWidth:3,
    shadowOn:true, shadowColor:'#000000', shadowBlur:8,
    blockOn:false, blockColor:'#000000', blockOpacity:60, blockPadding:10, blockRadius:8, blockOffsetX:0, blockOffsetY:0
  };
}
let styles = {
  title:    newTextStyle(37,700,'Fuji F601'),
  subtitle: newTextStyle(16,500,'夏日清涼特輯'),
  badge:    Object.assign(newTextStyle(16,400,''), {on:true, line1:'FLASH', line2:'FILTER'}),
  line:     { color:'#ffffff', width:3, dash:false, offsetX:0, offsetY:0, iconOpacity:100, iconSize:1, tintOn:false, useSvgIcon:false,
    shapeOn:false, shapeType:'rect', shapeColor:'#111111', shapeOpacity:100, shapeW:80, shapeH:80, shapeRadius:0, shapeOffsetX:0, shapeOffsetY:0 }
};
const COMPONENTS = [
  {key:'title', label:'標題'},
  {key:'subtitle', label:'副標'},
  {key:'badge', label:'角標'},
  {key:'line', label:'線條/圖示'}
];
// which components each of the 4 Figma layouts actually uses (title & line are always usable —
// line covers the generic color-block shape which any layout can show)
const LAYOUT_COMPONENTS = [
  ['title','badge','line'],   // card1 — 標籤款＋圖示
  ['title','badge','line'],   // card2 — 置中標題款（badge 也用於 BA 對比模式的 Before 標籤）
  ['title','badge','line'],   // card3 — 標籤款
  ['title','subtitle','badge','line'], // card4 — 置中標題＋副標款
];
let activeComp = 'title';

let state = {
  sizeIdx:0, layoutIdx:0,
  images:[], selected:[],
  imgMode:'single', imgRatio:0.5,
  imgOffsetX:0, imgOffsetY:0, imgScale:1,
  beforeImgIndex:null, beforeOffsetX:0, beforeOffsetY:0, beforeScale:1,
  svgIcon:null,
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cards = [];
let groupNames = {}; // sizeIdx -> custom group label
let activeCardIdx = 0;
const MAX_CARDS = 10;

function updateGuideVisibility(){
  const guideOn = document.getElementById('guideToggle').checked;
  const gridOn = document.getElementById('gridToggle').checked;
  const el = document.getElementById('centerGuide');
  el.classList.toggle('show-center', guideOn);
  el.classList.toggle('show-grid', gridOn);
}
document.getElementById('guideToggle').addEventListener('change', updateGuideVisibility);
document.getElementById('gridToggle').addEventListener('change', updateGuideVisibility);

// ---------- size chips ----------
const sizeRow = document.getElementById('sizeRow');
SIZES.forEach((s,i)=>{
  const c = document.createElement('div');
  c.className = 'chip' + (i===0?' active':'');
  c.textContent = s.label;
  c.onclick = ()=> changeActiveCardSize(i);
  sizeRow.appendChild(c);
});
// changing the working size effectively moves the current card into a different group.
// if this card is the ONLY member of its current group, that group would vanish — so we
// duplicate it first to preserve the old group, then apply the new size to the duplicate.
function changeActiveCardSize(newSizeIdx){
  if(newSizeIdx === state.sizeIdx) return;
  if(cards.length){
    cards[activeCardIdx] = snapshotState();
    const soleInGroup = cards.filter(c=>c.sizeIdx===state.sizeIdx).length <= 1;
    if(soleInGroup && cards.length < MAX_CARDS){
      const clone = JSON.parse(JSON.stringify(cards[activeCardIdx]));
      cards.splice(activeCardIdx, 0, clone);
      activeCardIdx = activeCardIdx + 1;
    }
  }
  state.sizeIdx = newSizeIdx;
  refreshChips();
  render();
}
function refreshChips(){
  [...sizeRow.children].forEach((c,i)=>c.classList.toggle('active', i===state.sizeIdx));
  [...layoutRow.children].forEach((c,i)=>c.classList.toggle('active', i===state.layoutIdx));
  document.getElementById('sizeLabel').textContent = SIZES[state.sizeIdx].label + ' px（滿版輸出，無外框）';
  if(typeof updateCompTabsAvailability === 'function') updateCompTabsAvailability();
  updateBeforePanelVisibility();
}

// ---------- layout thumbs ----------
const layoutRow = document.getElementById('layoutRow');
const thumbSVGs = [
  `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#888"/><text x="8" y="20" font-size="9" fill="#fff" font-family="sans-serif">FLASH</text><text x="8" y="30" font-size="9" fill="#fff" font-family="sans-serif">FILTER</text><text x="8" y="88" font-size="15" fill="#fff" font-family="sans-serif">Aa</text><rect x="80" y="80" width="5" height="12" fill="#fff"/></svg>`,
  `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#888"/><text x="50" y="88" font-size="15" fill="#fff" font-family="sans-serif" text-anchor="middle">Aa</text></svg>`,
  `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#888"/><text x="8" y="20" font-size="9" fill="#fff" font-family="sans-serif">FLASH</text><text x="8" y="30" font-size="9" fill="#fff" font-family="sans-serif">FILTER</text><text x="8" y="88" font-size="15" fill="#fff" font-family="sans-serif">Aa</text></svg>`,
  `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#888"/><text x="50" y="82" font-size="15" fill="#fff" font-family="sans-serif" text-anchor="middle">Aa</text><text x="50" y="92" font-size="7" fill="#fff" font-family="sans-serif" text-anchor="middle">subtitle</text></svg>`
];
LAYOUT_NAMES.forEach((name,i)=>{
  const d = document.createElement('div');
  d.className = 'layout-thumb' + (i===state.layoutIdx?' active':'');
  d.innerHTML = thumbSVGs[i];
  d.title = name;
  d.onclick = ()=>{ state.layoutIdx=i; refreshChips(); render(); };
  layoutRow.appendChild(d);
});

// ---------- image upload & selection ----------

function renderThumbs(){
  thumbsDiv.innerHTML='';
  state.images.forEach((img,idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const selPos = state.selected.indexOf(idx);
    if(selPos===0) wrap.classList.add('sel-1');
    if(selPos===1) wrap.classList.add('sel-2');
    const t = document.createElement('img');
    t.src = img.src;
    wrap.appendChild(t);
    const idxB = document.createElement('div'); idxB.className='idx-num'; idxB.textContent=idx+1; wrap.appendChild(idxB);
    const delB = document.createElement('div'); delB.className='del-btn'; delB.textContent='✕';
    delB.onclick = (e)=>{ e.stopPropagation(); deleteImage(idx); };
    wrap.appendChild(delB);
    if(selPos>-1){ const b=document.createElement('div'); b.className='badge-num'; b.textContent=selPos+1; wrap.appendChild(b); }
    const beforeB = document.createElement('div');
    beforeB.className = 'before-btn' + (state.beforeImgIndex===idx ? ' active' : '');
    beforeB.textContent = 'B';
    beforeB.title = '設為 Before 對比小圖';
    beforeB.onclick = (e)=>{
      e.stopPropagation();
      state.beforeImgIndex = (state.beforeImgIndex===idx) ? null : idx;
      renderThumbs(); buildBeforeImgPanel(); render();
    };
    wrap.appendChild(beforeB);
    wrap.onclick = ()=>{
      const pos = state.selected.indexOf(idx);
      if(pos>-1){ state.selected.splice(pos,1); }
      else {
        state.selected.push(idx);
        if(state.selected.length > maxSelectable()) state.selected.shift();
      }
      renderThumbs(); render();
    };
    thumbsDiv.appendChild(wrap);
  });
  if(typeof buildBeforeImgPanel === 'function') buildBeforeImgPanel();
}
function deleteImage(idx){
  if(!confirm('刪除這張圖片？所有卡片配置中用到這張圖的地方也會一併移除。')) return;
  state.images.splice(idx,1);
  const remap = arr => (arr||[]).filter(i=>i!==idx).map(i=> i>idx ? i-1 : i);
  state.selected = remap(state.selected);
  cards.forEach(c=>{ c.selected = remap(c.selected); });
  const remapSingle = (val)=> val==null ? null : (val===idx ? null : (val>idx ? val-1 : val));
  state.beforeImgIndex = remapSingle(state.beforeImgIndex);
  cards.forEach(c=>{ c.beforeImgIndex = remapSingle(c.beforeImgIndex); });
  renderThumbs(); render();
}

function selectedImages(){ return state.selected.map(i=>state.images[i]).filter(Boolean); }

function drawComposedBackground(x,y,w,h){
  const imgs = selectedImages();
  if(imgs.length===0){ ctx.fillStyle='#8a8a8a'; ctx.fillRect(x,y,w,h); }
  else if(imgs.length===1 || state.imgMode==='single' || state.imgMode==='ba'){ drawImageCover(imgs[0],x,y,w,h); }
  else if(state.imgMode==='vertical'){
    const h1 = h*state.imgRatio;
    drawImageCover(imgs[0],x,y,w,h1);
    drawImageCover(imgs[1],x,y+h1,w,h-h1);
  } else {
    const w1 = w*state.imgRatio;
    drawImageCover(imgs[0],x,y,w1,h);
    drawImageCover(imgs[1],x+w1,y,w-w1,h);
  }
  if(state.imgMode==='ba') drawBAInset(x,y,w,h);
}
function drawBAInset(x,y,w,h){
  const insetW = w*0.29, insetH = h*0.233;
  const insetX = x+w*0.647, insetY = y+h*0.045;
  const insetR = insetW*0.105;
  ctx.save();
  roundRectPath(insetX,insetY,insetW,insetH,insetR);
  ctx.clip();
  drawBeforeImage(insetX,insetY,insetW,insetH);
  ctx.restore();
  ctx.save();
  roundRectPath(insetX,insetY,insetW,insetH,insetR);
  ctx.lineWidth = Math.max(1, w*0.0015);
  ctx.strokeStyle = '#000000';
  ctx.stroke();
  ctx.restore();
  if(styles.badge.on){
    styledText('badge', 'Before', insetX+insetW*0.115, insetY+insetH*0.177, 'left');
  }
}

// ---------- drawing helpers ----------
function drawImageCoverParams(img,x,y,w,h,offsetX,offsetY,scale){
  const ir = img.width/img.height, tr = w/h;
  let sx,sy,sw,sh;
  if(ir > tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; }
  else{ sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  scale = scale || 1;
  if(scale !== 1){
    const nsw = Math.min(img.width, sw/scale), nsh = Math.min(img.height, sh/scale);
    sx += (sw-nsw)/2; sy += (sh-nsh)/2;
    sw = nsw; sh = nsh;
  }
  const offX = (offsetX||0)/100 * sw;
  const offY = (offsetY||0)/100 * sh;
  sx = Math.max(0, Math.min(img.width-sw, sx+offX));
  sy = Math.max(0, Math.min(img.height-sh, sy+offY));
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function drawImageCover(img,x,y,w,h){
  drawImageCoverParams(img,x,y,w,h, state.imgOffsetX, state.imgOffsetY, state.imgScale);
}
function drawBeforeImage(x,y,w,h){
  const img = (state.beforeImgIndex!=null) ? state.images[state.beforeImgIndex] : null;
  if(!img){ ctx.fillStyle='#9a9a9a'; ctx.fillRect(x,y,w,h); return; }
  drawImageCoverParams(img,x,y,w,h, state.beforeOffsetX, state.beforeOffsetY, state.beforeScale);
}
function roundRectPath(x,y,w,h,r){
  r = Math.max(0, Math.min(r, Math.min(w,h)/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function gv(id){ return document.getElementById(id).value; }
function gc(id){ return document.getElementById(id).checked; }
function rangeNumHTML(id,label,min,max,value,step){
  step = step||1;
  return `<div><label>${label}</label><div style="display:flex;gap:4px;align-items:center;"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" style="flex:1;"><input type="number" id="${id}_num" value="${value}" step="${step}" style="width:52px;padding:5px 4px;border:2px solid var(--ink);border-radius:8px;font-size:11px;font-family:inherit;text-align:center;"></div></div>`;
}
function wireRangeNum(id,cb){
  const r = document.getElementById(id), n = document.getElementById(id+'_num');
  if(!r||!n) return;
  r.oninput = ()=>{ n.value=r.value; cb(+r.value); };
  n.oninput = ()=>{ if(n.value==='' || n.value==='-') return; let v=+n.value; if(isNaN(v)) return; r.value=v; cb(v); };
}
function wireCenterBtn(btnId, xId, yId, s, xKey, yKey){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  btn.onclick = ()=>{
    s[xKey]=0; s[yKey]=0;
    const xr=document.getElementById(xId), xn=document.getElementById(xId+'_num');
    const yr=document.getElementById(yId), yn=document.getElementById(yId+'_num');
    if(xr) xr.value=0; if(xn) xn.value=0;
    if(yr) yr.value=0; if(yn) yn.value=0;
    render();
  };
}

function drawTextBlock(c,text,x,y,align){
  if(!c.blockOn) return;
  ctx.font = `${c.weight} ${c.size}px ${c.font}`;
  const tw = measureSpaced(ctx,text,c.letterSpacing);
  const pad = c.blockPadding;
  let bx;
  if(align==='center') bx = x - tw/2 - pad;
  else if(align==='right') bx = x - tw - pad;
  else bx = x - pad;
  bx += c.blockOffsetX;
  const by = y - c.size*0.95 - pad + c.blockOffsetY;
  const bw = tw + pad*2;
  const bh = c.size*1.25 + pad*2;
  ctx.save();
  ctx.globalAlpha = c.blockOpacity/100;
  roundRectPath(bx,by,bw,bh,c.blockRadius);
  ctx.fillStyle = c.blockColor;
  ctx.fill();
  ctx.restore();
}

function measureSpaced(ctx,text,letterSpacing){
  let w = ctx.measureText(text).width;
  if(text.length>1) w += letterSpacing*(text.length-1);
  return w;
}
function fillSpacedText(ctx,text,x,y,align,letterSpacing,stroke){
  if(!letterSpacing){
    ctx.textAlign = align;
    if(stroke) ctx.strokeText(text,x,y); else ctx.fillText(text,x,y);
    return;
  }
  const totalW = measureSpaced(ctx,text,letterSpacing);
  let startX;
  if(align==='center') startX = x - totalW/2;
  else if(align==='right') startX = x - totalW;
  else startX = x;
  ctx.textAlign = 'left';
  let cx = startX;
  for(const ch of text){
    if(stroke) ctx.strokeText(ch,cx,y); else ctx.fillText(ch,cx,y);
    cx += ctx.measureText(ch).width + letterSpacing;
  }
}

// draws text using a named component's style (own font, offset, letter-spacing, optional block)
function styledText(compKey,text,x,y,align){
  const c = styles[compKey];
  x += c.offsetX; y += c.offsetY;
  drawTextBlock(c,text,x,y,align);
  ctx.font = `${c.weight} ${c.size}px ${c.font}`;
  ctx.textBaseline = 'alphabetic';
  if(c.shadowOn){ ctx.shadowColor=c.shadowColor; ctx.shadowBlur=c.shadowBlur; ctx.shadowOffsetY=c.shadowBlur*0.25; }
  else { ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0; }
  if(c.outlineOn){ ctx.lineWidth=c.outlineWidth; ctx.strokeStyle=c.outlineColor; fillSpacedText(ctx,text,x,y,align||'left',c.letterSpacing,true); }
  ctx.fillStyle = c.color;
  fillSpacedText(ctx,text,x,y,align||'left',c.letterSpacing,false);
  ctx.shadowColor='transparent'; ctx.shadowBlur=0;
}

function collectGlobal(){
  return {
    title: styles.title.text, sub: styles.subtitle.text,
    badgeOn: styles.badge.on, badgeLine1: styles.badge.line1, badgeLine2: styles.badge.line2,
    useSvgIcon: styles.line.useSvgIcon && !!state.svgIcon
  };
}

function drawTintedIcon(img,x,y,w,h,color,opacity){
  const off = document.createElement('canvas'); off.width=Math.max(1,Math.round(w)); off.height=Math.max(1,Math.round(h));
  const octx = off.getContext('2d');
  octx.drawImage(img,0,0,off.width,off.height);
  octx.globalCompositeOperation='source-in';
  octx.fillStyle=color;
  octx.fillRect(0,0,off.width,off.height);
  ctx.save(); ctx.globalAlpha=opacity; ctx.drawImage(off,x,y,w,h); ctx.restore();
}

// icon slot: draws uploaded SVG (with size/opacity/tint from the line component) or a fallback shape
function drawIconSlot(g,cx,cy,baseSize,defaultDraw){
  const l = styles.line;
  cx += l.offsetX; cy += l.offsetY;
  const size = baseSize * l.iconSize;
  if(g.useSvgIcon){
    const im = state.svgIcon;
    const r = im.width/im.height;
    let w=size,h=size;
    if(r>1) h=size/r; else w=size*r;
    if(l.tintOn) drawTintedIcon(im, cx-w/2, cy-h/2, w, h, l.color, l.iconOpacity/100);
    else { ctx.save(); ctx.globalAlpha=l.iconOpacity/100; ctx.drawImage(im, cx-w/2, cy-h/2, w, h); ctx.restore(); }
  } else if(defaultDraw){ defaultDraw(cx,cy,size); }
}

function drawLine(x,y,w,h){
  const l = styles.line;
  x += l.offsetX; y += l.offsetY;
  ctx.fillStyle = l.color;
  if(l.dash){
    const dashLen = Math.max(4,w/8);
    for(let dx=0; dx<w; dx+=dashLen*2){ ctx.fillRect(x+dx,y,Math.min(dashLen,w-dx),h); }
  } else {
    ctx.fillRect(x,y,w,h);
  }
}

function drawBlockShape(W,H){
  const s = styles.line;
  if(!s.shapeOn) return;
  const cx = W/2 + s.shapeOffsetX, cy = H/2 + s.shapeOffsetY;
  ctx.save();
  ctx.globalAlpha = s.shapeOpacity/100;
  ctx.fillStyle = s.shapeColor;
  if(s.shapeType==='circle'){
    const r = Math.min(s.shapeW,s.shapeH)/2;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  } else {
    const r = s.shapeType==='pill' ? Math.min(s.shapeW,s.shapeH)/2 : s.shapeRadius;
    roundRectPath(cx-s.shapeW/2, cy-s.shapeH/2, s.shapeW, s.shapeH, r);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- 4 layouts, matching the Figma reference frames exactly (no color-block backgrounds by default) ----------

// card1 — Rectangle6: badge two-line label top-left + title bottom-left + small accent icon
function layoutCard1(g,W,H){
  drawComposedBackground(0,0,W,H);
  drawBlockShape(W,H);
  const bx = W*(37/360), by = H*(33/480);
  if(g.badgeOn){
    const badgeLine1Y = by+styles.badge.size;
    styledText('badge', g.badgeLine1, bx, badgeLine1Y, 'left');
    if(g.badgeLine2) styledText('badge', g.badgeLine2, bx, badgeLine1Y+styles.badge.size*styles.badge.lineHeight, 'left');
  }
  const tx = W*(37/360), ty = H*(405/480)+styles.title.size*0.35;
  styledText('title', g.title, tx, ty, 'left');
  const ix = W*(302/360)+W*0.026, iy = H*(405/480)+H*0.02;
  drawIconSlot(g, ix, iy, Math.min(W,H)*0.09, (cx,cy,size)=>{
    drawLine(cx-styles.line.width/2, cy-size*0.55, styles.line.width, size);
  });
}

// card2 — Rectangle7: centered title only, bottom of frame
function layoutCard2(g,W,H){
  drawComposedBackground(0,0,W,H);
  drawBlockShape(W,H);
  styledText('title', g.title, W/2, H*(405/480)+styles.title.size*0.35, 'center');
}

// card3 — Rectangle8: same as card1 but no icon
function layoutCard3(g,W,H){
  drawComposedBackground(0,0,W,H);
  drawBlockShape(W,H);
  const bx = W*(37/360), by = H*(33/480);
  if(g.badgeOn){
    const badgeLine1Y = by+styles.badge.size;
    styledText('badge', g.badgeLine1, bx, badgeLine1Y, 'left');
    if(g.badgeLine2) styledText('badge', g.badgeLine2, bx, badgeLine1Y+styles.badge.size*styles.badge.lineHeight, 'left');
  }
  const tx = W*(37/360), ty = H*(405/480)+styles.title.size*0.35;
  styledText('title', g.title, tx, ty, 'left');
}

// card4 — Rectangle9: centered title + subtitle line beneath
function layoutCard4(g,W,H){
  drawComposedBackground(0,0,W,H);
  drawBlockShape(W,H);
  const ty = H*(405/480)+styles.title.size*0.35;
  styledText('title', g.title, W/2, ty, 'center');
  if(g.sub) styledText('subtitle', g.sub, W/2, ty+styles.subtitle.size*styles.subtitle.lineHeight, 'center');
}

const LAYOUTS = [layoutCard1, layoutCard2, layoutCard3, layoutCard4];

// ---------- main render (always full-bleed export, no border/clip) ----------
function buildGroupOrder(){
  const order = [];
  cards.forEach(c=>{ if(!order.includes(c.sizeIdx)) order.push(c.sizeIdx); });
  return order;
}
function groupLabel(szIdx,letter){
  return groupNames[szIdx] || `${letter}組 · ${SIZES[szIdx].label}`;
}

function syncGroupStyles(sourceIdx){
  const source = cards[sourceIdx];
  if(!source) return;
  cards.forEach((c,i)=>{
    if(i===sourceIdx || c.sizeIdx!==source.sizeIdx) return;
    const keepTitleText = c.styles.title.text;
    const keepSubText = c.styles.subtitle.text;
    const keepBadgeLine1 = c.styles.badge.line1;
    const keepBadgeLine2 = c.styles.badge.line2;
    const keepSelected = c.selected;
    c.styles = JSON.parse(JSON.stringify(source.styles));
    c.styles.title.text = keepTitleText;
    c.styles.subtitle.text = keepSubText;
    c.styles.badge.line1 = keepBadgeLine1;
    c.styles.badge.line2 = keepBadgeLine2;
    c.layoutIdx = source.layoutIdx;
    c.imgMode = source.imgMode;
    c.imgRatio = source.imgRatio;
    c.selected = keepSelected;
  });
}

function render(){
  const sz = SIZES[state.sizeIdx];
  cv.width = sz.w; cv.height = sz.h;
  const g = collectGlobal();
  ctx.clearRect(0,0,sz.w,sz.h);
  LAYOUTS[state.layoutIdx](g,sz.w,sz.h);
  if(cards.length){
    cards[activeCardIdx] = snapshotState();
    syncGroupStyles(activeCardIdx);
    buildCardRow();
  }
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
}

document.getElementById('downloadBtn').onclick = ()=>{
  const link = document.createElement('a');
  const sz = SIZES[state.sizeIdx];
  link.download = `card_${sz.w}x${sz.h}_layout${state.layoutIdx+1}.png`;
  link.href = cv.toDataURL('image/png');
  link.click();
};

// ---------- multi-card configuration list (max 10 cards, each a full snapshot) ----------
function snapshotState(){
  return {
    styles: JSON.parse(JSON.stringify(styles)),
    layoutIdx: state.layoutIdx, sizeIdx: state.sizeIdx,
    imgMode: state.imgMode, imgRatio: state.imgRatio,
    imgOffsetX: state.imgOffsetX, imgOffsetY: state.imgOffsetY, imgScale: state.imgScale,
    beforeImgIndex: state.beforeImgIndex, beforeOffsetX: state.beforeOffsetX, beforeOffsetY: state.beforeOffsetY, beforeScale: state.beforeScale,
    selected: [...state.selected],
  };
}
function applySnapshot(snap){
  styles = JSON.parse(JSON.stringify(snap.styles));
  state.layoutIdx = snap.layoutIdx; state.sizeIdx = snap.sizeIdx;
  state.imgMode = snap.imgMode; state.imgRatio = snap.imgRatio;
  state.imgOffsetX = snap.imgOffsetX||0; state.imgOffsetY = snap.imgOffsetY||0; state.imgScale = snap.imgScale||1;
  state.beforeImgIndex = (snap.beforeImgIndex!=null && snap.beforeImgIndex<state.images.length) ? snap.beforeImgIndex : null;
  state.beforeOffsetX = snap.beforeOffsetX||0; state.beforeOffsetY = snap.beforeOffsetY||0; state.beforeScale = snap.beforeScale||1;
  if(snap.selected) state.selected = snap.selected.filter(i=>i<state.images.length);
  imgModeSel.value = state.imgMode;
  ratioWrap.style.display = (state.imgMode==='vertical' || state.imgMode==='horizontal') ? 'block' : 'none';
  imgRatioInput.value = state.imgRatio*100;
  document.getElementById('imgRatio_num').value = state.imgRatio*100;
  refreshChips();
  renderThumbs();
  buildCompPanel();
  buildImgPosPanel();
  buildBeforeImgPanel();
  updateBeforePanelVisibility();
  render();
}
function buildCardRow(){
  const container = document.getElementById('cardRow');
  container.innerHTML = '';
  const letters = 'ABCDEFGHIJ';
  const groupOrder = buildGroupOrder();
  groupOrder.forEach((szIdx,gi)=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'card-group';
    const header = document.createElement('input');
    header.type = 'text';
    header.className = 'card-group-label-input';
    header.value = groupLabel(szIdx, letters[gi]);
    header.title = '點擊可自行輸入這組的名稱';
    header.oninput = ()=>{ groupNames[szIdx] = header.value; };
    header.onblur = ()=>{ if(!header.value.trim()){ delete groupNames[szIdx]; header.value = groupLabel(szIdx, letters[gi]); } };
    groupWrap.appendChild(header);
    const rowScroll = document.createElement('div');
    rowScroll.className = 'card-row-scroll';
    let n = 0;
    cards.forEach((c,i)=>{
      if(c.sizeIdx!==szIdx) return;
      n++;
      const chip = document.createElement('div');
      chip.className = 'chip' + (i===activeCardIdx?' active':'');
      chip.style.position = 'relative';
      chip.textContent = `${letters[gi]}-${n}`;
      chip.onclick = ()=> switchCard(i);
      if(cards.length>1){
        const x = document.createElement('span');
        x.textContent = ' ✕'; x.style.opacity = '.7';
        x.onclick = (e)=>{ e.stopPropagation(); deleteCard(i); };
        chip.appendChild(x);
      }
      rowScroll.appendChild(chip);
    });
    groupWrap.appendChild(rowScroll);
    container.appendChild(groupWrap);
  });
  document.getElementById('dupCardBtn').style.opacity = cards.length>=MAX_CARDS ? '.4' : '1';
}
function switchCard(i){
  if(i===activeCardIdx) return;
  cards[activeCardIdx] = snapshotState();
  activeCardIdx = i;
  applySnapshot(cards[i]);
  buildCardRow();
}
function deleteCard(i){
  if(cards.length<=1) return;
  cards.splice(i,1);
  if(activeCardIdx>=cards.length) activeCardIdx = cards.length-1;
  else if(i<activeCardIdx) activeCardIdx--;
  applySnapshot(cards[activeCardIdx]);
  buildCardRow();
}
document.getElementById('dupCardBtn').onclick = ()=>{
  if(cards.length>=MAX_CARDS){ alert(`最多只能建立 ${MAX_CARDS} 組卡片配置`); return; }
  cards[activeCardIdx] = snapshotState();
  const clone = JSON.parse(JSON.stringify(cards[activeCardIdx]));
  cards.splice(activeCardIdx+1,0,clone);
  activeCardIdx = activeCardIdx+1;
  applySnapshot(cards[activeCardIdx]);
  buildCardRow();
};

// ---------- persist everything to this browser's localStorage so it survives closing the file ----------
const STORAGE_KEY = 'cardMakerAutosave_v1';
let autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveToLocalStorage, 500);
}
function saveToLocalStorage(){
  const statusEl = document.getElementById('autosaveStatus');
  try{
    if(cards.length) cards[activeCardIdx] = snapshotState();
    const payload = {
      cards, groupNames, activeCardIdx,
      images: state.images.map(img=>img.src),
      svgIconSrc: state.svgIcon ? state.svgIcon.src : null,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    if(statusEl) statusEl.textContent = '💾 已自動儲存 · ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  } catch(err){
    console.warn('autosave failed', err);
    if(statusEl) statusEl.textContent = '⚠️ 自動儲存失敗（可能圖片太多，超過瀏覽器儲存容量），建議減少圖片數量或大小';
  }
}
function initFreshCard(){
  refreshChips();
  cards.push(snapshotState());
  buildCardRow();
  render();
}
function loadFromLocalStorageAndInit(){
  let raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); } catch(err){ raw = null; }
  if(!raw){ initFreshCard(); return; }
  let payload;
  try{ payload = JSON.parse(raw); } catch(err){ initFreshCard(); return; }
  const imgSrcs = payload.images || [];
  const loadedImages = new Array(imgSrcs.length);
  let remaining = imgSrcs.length;
  function finish(){
    state.images = loadedImages;
    cards = payload.cards || [];
    groupNames = payload.groupNames || {};
    activeCardIdx = Math.min(payload.activeCardIdx||0, Math.max(0,cards.length-1));
    if(cards.length===0){ initFreshCard(); return; }
    const finishApply = ()=>{ applySnapshot(cards[activeCardIdx]); buildCardRow(); };
    if(payload.svgIconSrc){
      const svgImg = new Image();
      svgImg.onload = ()=>{ state.svgIcon = svgImg; finishApply(); };
      svgImg.onerror = finishApply;
      svgImg.src = payload.svgIconSrc;
    } else { finishApply(); }
  }
  if(imgSrcs.length===0){ finish(); return; }
  imgSrcs.forEach((src,i)=>{
    const img = new Image();
    img.onload = ()=>{ loadedImages[i]=img; remaining--; if(remaining===0) finish(); };
    img.onerror = ()=>{ remaining--; if(remaining===0) finish(); };
    img.src = src;
  });
}
// ---------- mobile tab bar (only visually active on narrow screens; harmless on desktop) ----------
document.querySelectorAll('.mobile-tabbar .mtab').forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll('.mobile-tabbar .mtab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const key = tab.dataset.mtab;
    document.querySelectorAll('.mobile-panel').forEach(p=>{
      p.classList.toggle('mobile-panel-active', p.dataset.mtab===key);
    });
    document.getElementById('mobileTabbar').scrollIntoView({block:'start', behavior:'smooth'});
  };
});

document.getElementById('clearAutosaveBtn').onclick = ()=>{
  if(!confirm('確定要清除本機儲存的所有卡片紀錄嗎？這個動作無法復原。')) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(err){}
  location.reload();
};

document.fonts.ready.then(render);
loadFromLocalStorageAndInit();
</script>
